<!DOCTYPE html>
<html>

<head>
    <title>Smart School Bus Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🚌 Smart School Bus Dashboard</h1>

        <!-- Environment Monitoring -->
        <div class="card">
            <h2>Environment Monitoring</h2>
            <p id="temp">🌡 Temperature: --</p>
            <p id="hum">💧 Humidity: --</p>
            <p id="gas">☁ Gas Level: --</p>
        </div>

        <!-- Attendance Monitoring -->
        <div class="card">
            <h2>Attendance Monitoring</h2>
            
            <p id="route">🛣 Route: --</p>
            <p id="studentid">🪪 Student ID: --</p>
            <p id="studentname">👤 Student Name: --</p>
            <p id="status_code">📋 Status: --</p>
</div>

        <!-- Ride Summary -->
        <div class="card">
            <h2>Ride Summary</h2>
            <p id="rideStatus">Ride: --</p>
            <p id="rideRoute">Route: --</p>
            <p id="rideTotal">Total Students: --</p>
            <hr>
            <p id="rideList">Students List:<br>--</p>
        </div>


    </div>

    <script src="script.js"></script>

</body>

</html>
